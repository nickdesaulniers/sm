# Builds the GBA engine (sm-engine.gba) on every push and pull request, and
# for a tag named v*, publishes it as a GitHub release, with the script that
# makes the cartridge from a player's own ROM (tools/make_cartridge.py). The
# ROM itself is never part of the repository or of a release.
name: GBA

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to publish releases

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake ninja-build

      - name: Build
        run: |
          cmake -B build-gba -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=cmake/gba-toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release
          cmake --build build-gba

      - uses: actions/upload-artifact@v4
        with:
          name: sm-engine
          path: |
            build-gba/sm-engine.gba
            tools/make_cartridge.py

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-gba/sm-engine.gba
            tools/make_cartridge.py
          body: |
            The Game Boy Advance port's engine. It has none of the game's data:
            make the cartridge from your own Super Metroid ROM (the US release,
            sha1 da957f0d63d14cb441d215462904c4fa8519c613), with Python 3:

                python3 make_cartridge.py sm-engine.gba sm.smc sm.gba

            then run sm.gba in a GBA emulator, such as mGBA.
